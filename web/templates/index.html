<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Code Confessional</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>The Code Confessional</h1>
            <p>A log of developer sins, submitted anonymously.</p>
        </header>

        <div class="container">
          <aside class="leaderboard">
            <h2>Top Sins</h2>
            <div id="leaderboard-list"></div>
        </aside>
        </div>

        <div class="api-key-section">
            <button id="get-key-button">Get a New API Key</button>
            <p id="new-key-display"></p>
        </div>

       <form id="confess-form">
            <h3>Confess a New Sin</h3>
            <textarea id="sin-description" placeholder="Describe your code sin..." required></textarea>
            
            <div class="optional-fields">
                <input type="text" id="sin-tags" placeholder="Tags (comma-separated, e.g., bug,frontend)">
                <input type="number" id="sin-severity" placeholder="Severity (0-5)" min="0" max="5">
            </div>

            <div class="form-footer">
                <button type="submit">Confess</button>
            </div>
        </form>


        <main id="sins-list" class="sins-list"></main>
    </div>

    
    <div id="forgiven-overlay">
        <div class="content">
            <img src="/static/candle.gif" alt="Candle"> <p>Your sin is forgiven.</p>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
