    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>The Code Confessional</title>
        <link rel="stylesheet" href="/static/style.css">
        <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <header>
                <h1>The Code Confessional</h1>
                <p>A log of developer sins, submitted anonymously.</p>
                <a href="/search" class="nav-button">Search Sins</a>
            </header>

    
            <div class="api-key-section">
                <button id="get-key-button">Get a New API Key</button>
                <p id="new-key-display"></p>
            </div>

        <form id="confess-form">
                <h3>Confess a New Sin</h3>
                <textarea id="sin-description" placeholder="Describe your code sin..." required maxlength="500"></textarea>
                <div id="char-counter">500</div> 


                <div class="optional-fields">
                    <input type="text" id="sin-tags" placeholder="Tags (comma-separated, e.g., bug,frontend)">
                    <input type="number" id="sin-severity" placeholder="Severity (0-5)" min="0" max="5">
                    <div id="emoji-picker" class="emoji-picker"></div>
                    <button type="submit">Confess</button>
                </div>

            </form>
         <div id="gacha-game-container">
    <h2>Gacha Game</h2>

    <!-- This area holds all the interactive gacha elements -->
    <div class="gacha-main-area">
        <!-- 5. The new vertical bar on the left -->
        <div class="gacha-left-bar"></div>

        <div class="gacha-center-column">
            <!-- This area holds the reel and the roll button -->
            <div class="gacha-reel-area">
                <div id="gacha-viewport">
                    <!-- The gacha slot is now an invisible button INSIDE the viewport -->
                    <button id="gacha_slot" class="slot gacha-slot-overlay">-</button>
                    <div id="gacha-reel"></div>
                </div>
            </div>

            <!-- Inventory slots are centered underneath the reel -->
            <div class="inventory-area">
                <div class="slots-container">
                    <!-- Each slot now has a luck display div -->
                    <div class="slot-wrapper">
                        <div class="luck-display"></div>
                        <button id="inventory_slot_0" class="slot">-</button>
                    </div>
                    <div class="slot-wrapper">
                        <div class="luck-display"></div>
                        <button id="inventory_slot_1" class="slot">-</button>
                    </div>
                    <div class="slot-wrapper">
                        <div class="luck-display"></div>
                        <button id="inventory_slot_2" class="slot">-</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 1. The roll button is now a sibling for easier positioning -->
        <button id="gacha-roll-button">🎲</button>

        <!-- 3. The big display circle for the selected item -->
        <div id="item-display-circle" class="slot">
            <div id="item-display-emoji">-</div>
            <div id="item-display-luck">Luck: ?</div>
        </div>
    </div>
</div>

            <div class="main-content">
                        <aside class="leaderboard">
                            <h2>Top Sins</h2>
                                <div id="leaderboard-list"></div>
                        </aside>

                        <main id="sins-list" class="sins-list"></main>
                

                </div>


                
    

        <div id="forgiven-overlay">
            <div class="content">
                <img src="/static/candle.gif" alt="Candle"> <p>Your sin is forgiven.</p>
            </div>
        </div>
        </div>
        <script type="module" src="/static/script.js"></script>
    </body>
    </html>
