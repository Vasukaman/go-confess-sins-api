    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>The Code Confessional</title>
        <link rel="stylesheet" href="/static/style.css">
        <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <header>
                <h1>The Code Confessional</h1>
                <p>A log of developer sins, submitted anonymously.</p>
                <a href="/search" class="nav-button">Search Sins</a>
            </header>

    
            <div class="api-key-section">
                <button id="get-key-button">Get a New API Key</button>
                <p id="new-key-display"></p>
            </div>

        <form id="confess-form">
                <h3>Confess a New Sin</h3>
                <textarea id="sin-description" placeholder="Describe your code sin..." required maxlength="500"></textarea>
                <div id="char-counter">500</div> 


                <div class="optional-fields">
                    <input type="text" id="sin-tags" placeholder="Tags (comma-separated, e.g., bug,frontend)">
                    <input type="number" id="sin-severity" placeholder="Severity (0-5)" min="0" max="5">
                    <div id="emoji-picker" class="emoji-picker"></div>
                    <button type="submit">Confess</button>
                </div>

            </form>
         <div id="gacha-game-container">
    <h2>Gacha Game</h2>

  <!-- GACHA GAME UI - START -->
<div id="gacha-game-container">
    <h2>Gacha Game</h2>
    <div class="gacha-main-area">

        <!-- NEW: Wrapper for the entire selector control -->
        <div class="severity-control-wrapper">
            <div id="severity-selector-bar">
                <div class="severity-section" data-severity="5">5</div>
                <div class="severity-section" data-severity="4">4</div>
                <div class="severity-section" data-severity="3">3</div>
                <div class="severity-section" data-severity="2">2</div>
                <div class="severity-section" data-severity="1">1</div>
                <div id="severity-handle-wrapper">
                    <div id="severity-handle-grip"></div>
                </div>
            </div>

            <!-- The vertical bar now contains a dynamic fill element -->
            <div class="gacha-left-bar">
                <div id="gacha-bar-fill"></div>
            </div>
        </div>

        <div class="gacha-center-column">
            <!-- ... (rest of your gacha-center-column HTML is unchanged) ... -->
        </div>

        <!-- ... (rest of your gacha-main-area HTML is unchanged) ... -->
    </div>
</div>
<!-- GACHA GAME UI - END -->
            <div class="main-content">
                        <aside class="leaderboard">
                            <h2>Top Sins</h2>
                                <div id="leaderboard-list"></div>
                        </aside>

                        <main id="sins-list" class="sins-list"></main>
                

                </div>


                
    

        <div id="forgiven-overlay">
            <div class="content">
                <img src="/static/candle.gif" alt="Candle"> <p>Your sin is forgiven.</p>
            </div>
        </div>
        </div>
        <script type="module" src="/static/script.js"></script>
    </body>
    </html>
